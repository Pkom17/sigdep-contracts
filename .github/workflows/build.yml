name: build

# sigdep-contracts is a pure Java library — no Docker image, no runtime.
# This workflow just validates that the jar compiles on each push/PR.
# Release artefacts are consumed by sigdep-sync and sigdep-hub through
# a side-checkout + `mvn install`, see those repos' release.yml.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + install (local M2)
        run: mvn -B install

      - name: Verify the jar
        run: |
          jar=$(ls target/sigdep-contracts-*.jar | grep -v sources | grep -v javadoc | head -1)
          test -s "$jar" || (echo "jar missing" && exit 1)
          echo "OK : $jar"
